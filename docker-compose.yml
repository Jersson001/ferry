version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ferry_postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: ferry_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ferry_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: root
      DATABASE_PASSWORD: rootpassword
      DATABASE_NAME: ferry_db
      JWT_SECRET: ${JWT_SECRET:-ferry_super_secret_jwt_key_change_in_production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WOMPI_INTEGRITY_SECRET: ${WOMPI_INTEGRITY_SECRET:-}
      WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY:-}
      WOMPI_EVENTS_SECRET: ${WOMPI_EVENTS_SECRET:-}
      UPLOADS_PATH: /var/lib/ferry/uploads
      UPLOADS_BASE_URL: ${UPLOADS_BASE_URL:-http://localhost:3000/uploads}
      PORT: 3000
    volumes:
      # Mapeamos los uploads al disco del host Hostinger
      # Los archivos sobreviven reinicios del contenedor
      - ./uploads:/var/lib/ferry/uploads
    depends_on:
      - db

volumes:
  postgres_data:
