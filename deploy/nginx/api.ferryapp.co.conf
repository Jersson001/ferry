# Proxy inverso para el backend de Ferry.
# Recibe HTTPS en api.ferryapp.co y reenvía al contenedor de NestJS en :3000.
#
# Instalación en el VPS:
#   sudo cp api.ferryapp.co.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.ferryapp.co.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.ferryapp.co
#
# Certbot agrega solo el bloque de HTTPS y la redirección de HTTP.

server {
    listen 80;
    server_name api.ferryapp.co;

    # Las imágenes de la IA viajan en base64 dentro del JSON; el backend
    # acepta hasta 50mb, así que nginx no debe cortar antes.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las llamadas a Gemini tardan entre 15 y 35 s; el default de nginx
        # (60 s) alcanza, pero se deja margen para imágenes grandes.
        proxy_read_timeout 120s;
    }
}
